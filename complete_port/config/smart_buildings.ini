[base]
env_name = smart_buildings
cudagraphs = 1
# -1: automatically save complete snapshots for the supported r116 training
# configuration; 0: disabled; 1: require support or fail before training.
full_checkpoint = -1
# Explicitly allow a complete checkpoint to move between compatible GPUs.
# The restored state is preserved, but subsequent arithmetic can differ.
portable_resume = 0
# Explicit escape hatch for historical weights/momentum continuations; these
# do not preserve the trajectory and are rejected by default.
allow_partial_resume = 0
# The trainer's built-in evaluation waits for whole 8640-step episodes of every env (10000 of them
# by default); evaluate checkpoints separately (README, "Evaluate").
eval_episodes = 0
# 1 = mean / argmax actions (evaluation; the rollout sampler skips the exploration noise)
deterministic = 0
checkpoint_interval = 20

[vec]
# Multi-building default: the 30 shipped scenarios x 32 envs = 960 agents.  The 5 weathers of each
# building share one group (6 groups x 160 envs, one weather per 32-env slab): ~11.8K SPS, ~16 GB VRAM
# on the RTX 3090 (480 agents: ~9.3K SPS, 11 GB).  32 envs per scenario is the efficient size (a warp
# slab per weather); other counts work but the solve then loads its values per lane.
total_agents = 960
num_buffers = 1   # GPU env: the trainer requires a single buffer
num_threads = 4

[policy]
hidden_size = 256
num_layers = 2
# Shared 32-unit nonlinear zone actor with affine skip; 0 preserves old checkpoints.
zone_mlp = 0
# Shared 32-unit AHU actor residual; zero-output initialization, default off.
ahu_mlp = 0
# initial log-std of every continuous head (std 0.37; the env clips actions to [-1, 1], and with std 1 a
# large share of the exploration lands on the clip)
init_logstd = -1.0
# Gaussian mean = tanh(logit): stays inside the [-1, 1] the env clips to
tanh_mean = 1
# 1 = noise inside tanh. The Gaussian location is 3*tanh(logit/3), the env executes
# tanh of the pre-tanh sample, and the log-prob is the Gaussian at that sample.
# Overrides tanh_mean. Deterministic eval with this flag on is tanh of that location.
tanh_squash = 0
# binary_reheat (r100): zone reheat valves become Bernoulli gates (p = sigmoid(u + c0), p(u=0)=0.821,
# deterministic = p > 0.5), the same head the run commands already use. The closed valve becomes
# reachable, which it is not under the Beta head with beta_conc_max = 12 (7 sigma away at the
# occupied-step mean of 0.89). Needs beta = 1 and the shared canonical policy. Damper stays continuous.
binary_reheat = 0
# value_adam (r101): the value matrix joins the role readouts on Adam (Muon already frozen over that
# range by role_adam). With train.zone_value=1 only the building row of the value matrix carries a
# gradient and Muon normalises it to a constant step (measured: 0.978 x lr, p5..p95 identical), so the
# value cannot follow the returns. Needs role_adam=1, beta=1, value_shared=1.
value_adam = 0
# Exact chain derivative by default. 0.25 explicitly reproduces the r22
# surrogate-gradient experiment; it does not change forward actions.
squash_chain_floor = 0
# 1 = the scalar value head also reads the delay summary (worst-zone arrival,
# slope, fan path). The advantage stays the env return. Leave component_values off.
value_delay = 0
# occ_asinh (r77): pool feature 69, building occupancy, through asinh like the zone columns.
occ_asinh = 0
# no_cmd_echo (r97): 0 off, 1 zone valves, 2 every head. The actor's per-node local block drops the
# observation columns that are that head's own previous command, which are bit-exact copies of a_{t-1}
# (zone damper / reheat valve command; level 2 adds AHU SAT setpoint, recirculation, run command and
# plant water setpoint, dp setpoint, run status). Sensors, other devices' setpoints and the pooled trunk
# are unchanged. Read at policy creation, so train and eval must be given the same value.
no_cmd_echo = 0
# r117: shared local-zone value residual on top of the pooled zone critic.
# Training and checkpoint loading require the same setting; actor outputs are unchanged.
zone_value_residual = 0
# beta (r79): Beta policy on the continuous heads (Chou et al. 2017). alpha, beta = softplus + 1
# from two head outputs; env action 2x-1; deterministic = mean. Needs tanh_squash, tanh_mean and
# train.entropy_current = 0. A beta checkpoint has twice the role-head rows: evaluate it with beta = 1.
beta = 0
# Raw logit-Beta conditional likelihood for coherent exploration (r110; default off).
beta_conditional = 0
# Independent Beta mean and concentration for the r111 one-factor experiment.
# mu=sigmoid(u), k=2+10*sigmoid(v), alpha=mu*k, beta=(1-mu)*k.
# Shapes may fall below 1; the deterministic mean is unchanged by sampling.
beta_mean_precision = 0
# beta_floor (r80): alpha, beta = softplus + beta_floor (> 0). At 1 the uniform Beta(1, 1) is the
# corner where the softplus gradient vanishes; below 1 it is interior. Shapes below 1 use the
# Marsaglia-Tsang boost in the sampler. Evaluate a checkpoint with the floor it was trained with.
beta_floor = 1
# beta_cn_tau (r84, steps; 0 = off): temporally coherent Beta exploration. The sampler's two Gamma
# proposals start from per-agent, per-head AR(1) normals with correlation time tau, so each step's draw
# is exactly Beta(alpha, beta) (log-prob unchanged) and successive draws are correlated. Train only.
beta_cn_tau = 0
# beta_cn_tau_ahu (r91, steps; 0 = use beta_cn_tau): a longer try for the four AHU heads only
# (canonical slots 180..215; zone and plant heads keep beta_cn_tau). r87 measured the AHU heads'
# advantage credit as consistent but 2-5x weaker than the per-epoch gradient noise that walks their
# readout rows (r88/r89); a longer-held try makes the try's own contrast dominate that noise.
# Needs beta_cn_tau > 0. At beta_cn_tau_ahu = beta_cn_tau the trainer is bit-identical to the flag-off path.
beta_cn_tau_ahu = 0
# beta_conc_max (r94, 0 = off): cap the Beta concentration alpha+beta at this value, preserving the
# mean exactly (both shapes scaled alike, sampler and loss). Every failure mode so far ends with the
# heads locking (alpha+beta 13-30) while their credit still points the other way (r85 low, r90 high,
# r91 sat 29.8 in phoenix_6 at 30M); the cap is a non-decaying exploration term that keeps the draw
# spread alive so a wrong corner can still be left. Must be 0 or > 2 * beta_floor.
beta_conc_max = 0
# linear_lr_anneal (r94b, needs anneal_lr = 1): decay the learning rate linearly lr -> min_lr_ratio*lr
# over anneal_steps instead of the cosine over total_timesteps/epoch grid. The r94b stopping term:
# r94's walk away from its best save is credit-aligned on the training-side signal (P40 audit), so it
# is stopped by schedule, not by a credit or exploration prior.
linear_lr_anneal = 0
# anneal_steps (steps; 0 = anneal over the full total_timesteps grid): the real step budget the arm
# runs to; the anneal reaches lr_min exactly at this many steps.
anneal_steps = 0
# binary_run (r95, needs beta = 1): the AHU and hot-water run heads are Bernoulli on/off,
# p = sigmoid(u + c0), c0 so that p at u = 0 is the Beta head's P(x > 0.25) at u = v = 0. Stored
# action 1/0, env action 2x-1, deterministic = p > 0.5. A binary_run checkpoint must be evaluated
# with binary_run = 1. Under beta_cn_tau the draw is on iff Phi(z1) < p, so a switch holds.
binary_run = 0
# Legacy recurrent scalar critic, matching the r40 checkpoint layout.
value_shared = 0
# Preserve the checkpoint's per-head widths. Requires cold optimizer and no
# logstd anneal, so old momentum cannot move a parameter whose gradient is zero.
freeze_logstd = 0
# 1 = the decoder rows producing actions start at 0 (with env.residual the agent starts as the base controller)
zero_init_actions = 0

[env]
# One baked .sbb per scenario (see complete_port/README.md). Either point at a
# single blob, or at a directory (every .sbb is a scenario group, ordered building-first).
# Never a hardcoded building id or config path.
# Blank = fall back to the SB_BLOB_DIR environment variable. The keys must
# exist here for the --env.NAME=... overrides to work (ini.h only updates
# existing keys).
blob =
blob_dir =
# 0 = use the scenario's own steps_per_episode (8640 for the shipped set).
max_steps = 0
# Scenarios per batch (capped by the number of blobs; 0 = as many as fit with >= 32 envs each). A group is one scenario; its envs share one factorization.
groups = 30
# 1 = weathers of one building share a group (merged automatically when their blobs differ only in
# the weather sections): one solve with full warps, one copy of the geometry.  0 = one group per scenario.
merge_weathers = 1
# 1 = every env's first episode ends at a random step, so the batch spreads over the whole calendar
# (otherwise every env of an epoch sees the same hours of the same day)
desync = 1
# Randomize the calendar day of every episode, including the first. Requires a
# blob baked with --random-start-days=7; overrides desync so episodes are full.
random_start = 0
# Separate reproducible calendar RNG seed (the GPU env does not receive base.seed).
random_start_seed = 0
# multiplies the reward the trainer learns from (logs and metrics keep the raw reward)
reward_scale = 0.1
# 1 = PopArt-style per-scenario running normalization of the learning reward: rewards to the trainer
# become (r - mu_s)/sigma_s with per-scenario running mean/variance (updated at live-log time; one
# live-log lag is intentional).  Affine per scenario: action preferences within a scenario are
# unchanged; only the ~1000x cross-scenario return range is equalized so one shared critic can fit
# every scenario.  Logs/metrics/episode records keep the raw reward.  When 1, reward_scale is
# ignored by the learning path (leave it at 1 in the run config).  The running stats start at
# mu=0, inv_std=1 (unit variance): the old inv_std=0.1 init ramped ~10x over a segment and made the
# critic chase a moving target (measured r8 s05: 0.105 -> 1.037, loss/value spiked to 1.1e4).
rew_norm = 0
# 1 = per-scenario on-policy reward centering of the learning reward: r - mu_s, no division by
# std.  mu_s is an EMA of the raw window mean (env.center_beta), starting at 0.  Logs, metrics
# and episode records keep the raw reward.  Ignored when rew_norm = 1.
rew_center = 0
center_beta = 0.01
# Canonical layout (gpu/sb_gpu_base.inc): slot-structured, scaled observation (983 values) and per-slot continuous
# heads (219) that mean the same thing in every building; residual = 1 adds the policy's action, scaled by res_scale
# (continuous) / res_dscale (run bits), to the on-device pid_water base controller.  0 = the oracle's native layout.
canonical = 0
# Odd environment repeats the even environment's action with supply-air and hot-water
# setpoints raised by plant_eps for the whole rollout. 0 = off.
plant_pair = 0
plant_eps = 0.25
residual = 0
res_scale = 0.5
res_dscale = 1.5
# Comfort guard (residual only): the residual's authority on an action fades from 1 to 0 as its zone (an AHU: its worst
# zone; hot water: the worst zone of the building) goes from guard_d0 to guard_d0 + guard_d1 K below the base's band
# (guard_hot = 1: below or above).  guard_d1 = 0: off.
guard_d0 = 1.0
guard_d1 = 0.0
guard_hot = 0
# Train-only potential-based comfort shaping (0 = off).  The learning reward handed to the trainer gains
# F_t = shape_gamma*Phi(s_t) - Phi(s_{t-1}) with Phi = -comfort_shape * mean_z shortfall_z(s) - the same
# per-zone deviation curve the reward uses, but WITHOUT the occupancy weight, so a setback or plant
# shutdown is charged as the zones drift instead of when occupancy returns.  It telescopes to a
# policy-independent constant over an episode (the objective is unchanged, only the credit assignment
# moves) and reaches the trainer's reward only: rew_out, rp[], the live metrics and the eval dump keep
# the official reward.  See docs/HISTORY.md (r9d) and research/DECISIONS.md (D15).
comfort_shape = 0
shape_gamma = 0.99
# 1 = the shared actor reads anticipation and per-zone memory built from the
# observation. 0 = those nine inputs stay zero (the policy check).
zone_memory = 0
# 1 = round-robin the group's weathers across env indices, so an 8-env minibatch
# holds every weather. 0 keeps weather-major blocks.
interleave = 0
# 1 = zone reheat and damper heads train on that zone's productivity share plus
# the building's energy and carbon. Plant heads keep the full return. 0 is the
# scalar advantage. Needs zone_memory.
zone_adv = 0
# 1 = one value per canonical slot. Zone heads train on that slot's return.
# AHU and plant heads keep the building advantage. 0 keeps the scalar critic.
# Needs zone_memory. Do not combine with zone_adv.
zone_critic = 0
# 1 = with zone_critic, also one return per AHU: its own zones' productivity and the
# whole building's energy and carbon (the building reward when nobody is in). Needs train.ahu_critic.
ahu_critic = 0
# 1 = one learned command per zone. The damper slot is that command. The reheat
# slot and the pump head and pump run are masked, and the step decodes them.
# u = 0 is half reheat at the 0.1 damper floor and a running pump. Above that the
# coil finishes opening, then the damper opens. Below that the coil closes and
# the damper stays at the floor, unless the zone is above its cooling setpoint
# and the supply is colder than the zone. Pump head and the hot-water cap follow
# the average coil request. 0 leaves damper, reheat, and the pump as independent heads.
zone_command = 0
# 1 = after each reset, start between 02:00 and 06:00 with zone temperatures
# shifted. Eval and the oracle gate leave this off.
prestart_explore = 0
# probe (diagnostic; never a scored run): 1 = the hot-water command fixed at a = 0 (330 K through the
# contract map), 2 = reheat shut for zones above their cooling setpoint, 3 = both, applied on top of the
# policy's own actions. Prices the moves the policy does not make; needs canonical absolute actions.
probe = 0
# probe_water = 0.0
# zone_signed (r99): the zone-memory deficit features carry their sign (cold +, hot -) so a hot zone
# cannot excite the cold shortfall that opens its reheat valve. 0 leaves them unsigned.
zone_signed = 0
# zone_night_share (r99): at total occupancy 0 the per-zone target is the equal share of the empty
# building's energy and carbon bill instead of 0, so the valves are billed for night gas and fan power.
zone_night_share = 0

[train]
total_timesteps = 20_000_000
cudagraphs = 1
learning_rate = 0.0003
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 4
clip_coef = 0.2
# PPO ratio per action head (geometric mean over the active heads): the joint ratio over hundreds of
# continuous heads leaves any clip range after the smallest update (clipfrac ~1 even at lr 3e-6)
ratio_per_dim = 1
# 1 = clip each continuous Beta head's own behavior/current likelihood ratio.
# The legacy geometric aggregate remains available as loss/kl and clipfrac.
headwise_ratio = 0
# Refresh local zone GAE, returns and present-zone statistics together each replay pass.
zone_pass_refresh = 0
# Plant mean gradient from the paired official return. Must match env.plant_pair / env.plant_eps.
plant_pair = 0
plant_eps = 0.25
# Paired search in the weights. Both signs of one random change are run for a whole
# episode and the official return picks the winner. 0 = ordinary PPO.
ars = 0
# Separate productivity, energy, carbon and comfort-start value heads. The actor
# advantage is the weighted sum of the three component advantages. 0 = the scalar head.
component_values = 0
# A time-limit bootstrap uses the pre-reset value. The recurrent state still resets.
timeout_bootstrap = 0
ars_dirs = 16
ars_gens = 8
ars_nu = 0.02
ars_lr = 0.05
# adv_norm: 0 = raw advantages; 1 = standardize per minibatch (device mean/var over one minibatch);
# 2 = standardize over the whole rollout (one deterministic pass over every agent block).  Mode 2 is
# the one for multi-building batches: a minibatch is a run of agent blocks of the same scenario, so
# per-minibatch statistics recentre each building against itself and erase the cross-building
# advantage scale.  The value loss is unaffected either way (returns stay unnormalized).
adv_norm = 0
# 1 = compute GAE once from the stored rollout values, normalize that advantage
# once over the rollout, and train every visit in the epoch on that pair.
# Requires adv_norm=2. 0 recomputes GAE from the current value head each visit.
freeze_return = 0
# value_trunk_cap (r57): clamp the value path's contribution to the shared trunk gradient at the
# policy path's magnitude, measured once per minibatch visit. The value head's own gradient, the
# actor heads and the policy gradient are untouched. Needs policy.value_shared=1 and
# component_values=0: the separate-critic path puts no value gradient into the trunk, so the cap
# cannot bite there. 0 = off, the trunk is exactly (role gradients + value gradient).
# Telemetry: norm/vtc_capped_frac and norm/vtc_min_scale, plus an SB_VTC line per epoch.
value_trunk_cap = 0
# trunk_log (r77): read-only per-visit ||g_pi||, ||g_V|| at the trunk output (SB_TRUNK, norm/trunk_*).
trunk_log = 0
# head_adam (r77): the zone head on Adam (0.9/0.999/1e-8, the run lr); Muon frozen on it.
head_adam = 0
# role_adam (r92 / P39): the same Adam on all three role readouts role[0..2] (zone, AHU, plant; both Beta rows);
# Muon keeps the trunk. Allowed under policy.beta. Conflicts with head_adam and lastlayer_stepsize.
role_adam = 0
# value_spike_guard (r58): a relative guard on the trunk-side value tangent. Once per minibatch visit
# it clamps grad_value_h at q = 3 times its own trailing scale, s = min(1, 3*M/||g_V||), where M is
# the trailing geometric mean of ||g_V|| (an EMA of ln||g_V|| whose halflife is one epoch of visits,
# about 128). Only the surge is clipped: a chronic ratio below 3 passes through at s = 1. The policy
# path into the trunk, the critic's own row, the value loss and the actor heads are untouched. A
# short storm barely moves M, so the threshold holds the quiet baseline. Needs policy.value_shared=1
# and component_values=0. 0 = off.
# Telemetry: norm/vsg_bite_frac, norm/vsg_scale_mean, norm/vsg_scale_min, norm/vsg_ratio_mean,
# norm/vsg_ratio_max, norm/vsg_gv_geo, norm/vsg_frac_lt_q, norm/vsg_frac_ge_8q, plus an SB_VSG line.
value_spike_guard = 0
# lastlayer_stepsize (C14 / P28+P29, r69): per-weight step sizes with step-size optimization
# (IDBD, Sutton 1992 Fig. 2; SwiftTD's hard step-size bounds eta 0.1 / eta_min 1e-10 and its
# decay rule) own the three role readout matrices — the actor's last layer. Muon keeps the
# trunk, the value MLP, logstd and PopArt, and its clip norm still includes the role gradients
# (they are zeroed only after the norm is computed, so the trunk's update is the control's).
# Needs the plain shared actor: component_values=0, zone_critic=0, room_value=0. 0 = off.
# Telemetry: norm/idbd_alpha_mean, norm/idbd_eff_mean, norm/idbd_h_mean, norm/idbd_at_eta,
# norm/idbd_at_etamin, norm/idbd_decay_hits, norm/idbd_beta_mean, plus an SB_IDBD line.
lastlayer_stepsize = 0
# shuffle = 1: visit the minibatch-sized agent blocks in a fresh deterministic permutation each
# training call (Fisher-Yates, xorshift state advanced per call) instead of rollout order.  The
# order is baked into the captured train graph, so each call recaptures it (a few ms).
shuffle = 0
# rew_clamp: learning-reward clamp in sigmas of the per-scenario z-score (default 1.0 = the upstream
# +/-1 clamp).  <= 0 disables it: the z-tail the policy must learn to avoid reaches GAE instead of
# being clipped away.  The env logs live/rew_z_gt{1,3,5}_frac, i.e. what that exposes.
rew_clamp = 1.0
# k > 1 = hold the sampled action for k env steps (resample every k-th step): temporally
# correlated exploration (a setpoint persists like a real BMS cycle instead of iid per-step
# jitter that self-cancels in the thermal mass).  A terminal resets the hold; eval never holds.
action_repeat = 1
vf_coef = 0.5
vf_clip_coef = 10.0
max_grad_norm = 0.5
# 1 = Kingma Adam (beta1 0.9, beta2 0.999, eps 1e-8, bias correction, weight decay 0).
# 0 = Muon, the PufferLib optimizer. The global grad clip above is applied first.
adam = 0
ent_coef = 0.0
# ent_target_on (r82): the entropy coefficient follows the measured policy entropy once per epoch,
# c <- clamp(c * exp(ent_coef_lr * (ent_target - H)), ent_coef_min, ent_coef_max), starting at ent_coef
# (SAC's temperature rule). H is the epoch mean of loss/entropy (nats, summed over heads). Needs
# anneal_ent_coef = 0. Prints SB_ENTFLOOR epoch H coef_used coef_next; TensorBoard loss/ent_coef.
ent_target_on = 0
ent_target = -80
ent_coef_lr = 0.0035
ent_coef_min = 0.000001
ent_coef_max = 0.05
# ent_role_on (r83): the same rule with one coefficient per head role (zone, AHU, plant), each driven
# by that role's epoch mean entropy per active head, so the zone heads cannot hide a narrow plant head
# inside a total. Starts at ent_coef; excludes ent_target_on. Prints SB_ENTROLE; TensorBoard
# loss/ent_coef_{zone,ahu,plant}. loss/ent_head_{zone,ahu,plant} are logged either way.
ent_role_on = 0
ent_role_target = -1.0
ent_role_lr = 0.25
ent_role_min = 0.001
ent_role_max = 0.01
# Fresh current-policy continuous entropy samples; canonical run latents unchanged.
entropy_current = 0
# Read-only per-visit advantage, KL, gradient and actual-step diagnostics.
update_diagnostics = 0
# Stop the actor once this visit's sampled joint KL exceeds this many nats.
# 0 leaves every minibatch step on. The shared value row keeps stepping.
joint_kl = 0
# 1 = zone reheat and damper use that zone's productivity share. 0 is one advantage.
zone_adv = 0
# 1 = zone heads use the per-slot return. Requires value_shared and adv_norm 2.
zone_critic = 0
# 1 = with zone_critic, damper and reheat use the zone advantage alone (0 = 0.70 building + 0.30 zone).
valve_zone = 0
# 1 = retain the zone critic but send building advantage to both zone valve heads.
# This overrides valve_zone; it does not change the environment reward or critic loss.
valve_global = 0
# Valve team-return control variate (r114): shared detached affine baseline over
# existing zone inputs, trained only on the whole-building GAE. 0 preserves r94b.
valve_team_baseline = 0
# 1 = with zone_critic and env.ahu_critic, one value per AHU; the AHU heads (sat, sp, recirc, run)
# use that AHU's whitened advantage. Plant heads keep the building advantage.
ahu_critic = 0
# 1 = one value on that zone's 11 features. Damper and reheat use it.
# The building value is unchanged. Requires value_shared, value_delay, and
# env.zone_critic so the per-zone return exists. Do not combine with zone_critic.
room_value = 0
minibatch_size = 2048
horizon = 256

[policy]
# init_logstd: initial log-std of every continuous head (default -1 in this env's caller; sigma ~ 0.37)
# logstd_anneal = 1: overwrite the learned logstd every epoch. With logstd_hold = 0 the
# value is lerp(init_logstd, logstd_final, epoch/total_epochs). logstd_hold = 0.8 stays at
# init_logstd for the first 80% of epochs, then lerps to logstd_final over the rest, so
# the run explores before it commits. 0 anneal = the learned logstd (measured: frozen).
logstd_anneal = 0
logstd_final = -3.0
logstd_hold = 0

[base]
# 1 = checkpoints also carry the optimizer momentum (sidecar <checkpoint>.mb), so a rotation chain
# continues with live optimizer state instead of restarting it cold every segment.
checkpoint_optim = 0

[tb]
# TensorBoard: tensorboard --logdir <log_dir>/tb  (all dashboard keys, one scalar per epoch)
enabled = 1

[sweep]
metric = perf
